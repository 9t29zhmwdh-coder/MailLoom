name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  DATABASE_URL: sqlite:./ci_check.db

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Build frontend
        run: npm ci && npm run build
        working-directory: frontend
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features sqlite
      - name: Prepare database
        run: |
          sqlx database create
          sqlx migrate run --source crates/mp-core/src/db/migrations
      - name: cargo check
        run: cargo check --workspace
      - name: cargo clippy
        run: cargo clippy --workspace -- -D warnings
      - name: cargo test
        run: cargo test --workspace

  # Baut die App und startet sie einmal wirklich.
  #
  # Bis hierher prueft die CI ausschliesslich, ob sich alles uebersetzen laesst.
  # Ein Programm, das compiliert und beim Start sofort abstuerzt, waere jede
  # Pruefung gruen durchlaufen und erst beim Nutzer aufgefallen. Kein Klickpfad,
  # keine Oberflaechenpruefung, nur die Frage, ob der Prozess nach ein paar
  # Sekunden noch lebt.
  smoke:
    name: Smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          # xvfb zusaetzlich zu den Build-Paketen: der Runner hat keinen
          # Bildschirm, und ohne X-Server beendet sich ein GTK-Fenster sofort.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Build frontend
        run: npm ci && npm run build
        working-directory: frontend
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features sqlite
      - name: Prepare database
        run: |
          sqlx database create
          sqlx migrate run --source crates/mp-core/src/db/migrations

      - name: Build the application binary
        run: cargo build --bin mailloom

      - name: Start it and see whether it stays up
        shell: bash
        run: |
          set -uo pipefail
          bin=target/debug/mailloom

          # Unter Linux braucht das Fenster einen X-Server, sonst beendet sich
          # die App sofort und der Test meldete einen Fehler, den es ausserhalb
          # der CI nicht gibt.
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            xvfb-run -a "$bin" > start.log 2>&1 &
          else
            "$bin" > start.log 2>&1 &
          fi
          pid=$!

          # Fuenf Sekunden: lange genug fuer Fenster, WebView und die
          # Datenbankverbindung, kurz genug fuer die CI.
          sleep 5

          if ! kill -0 "$pid" 2>/dev/null; then
            echo "Die Anwendung hat sich innerhalb von fuenf Sekunden beendet."
            echo "--- Ausgabe ---"
            cat start.log
            exit 1
          fi

          echo "Laeuft nach fuenf Sekunden noch, PID $pid."
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true

          # Eine Panic waere auch dann ein Fehler, wenn der Prozess ueberlebt:
          # ein abgestuerzter Hintergrund-Task faellt sonst nicht auf.
          if grep -qiE "panicked at|thread .* panicked" start.log; then
            echo "Panic beim Start:"
            cat start.log
            exit 1
          fi
          echo "--- Ausgabe ---"
          cat start.log

  frontend:
    name: Frontend typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Typecheck & build
        run: npm run build
        working-directory: frontend

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:./ci_check.db
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features sqlite
      - name: Prepare database
        run: |
          sqlx database create
          sqlx migrate run --source crates/mp-core/src/db/migrations
      - name: Install tarpaulin
        run: cargo install cargo-tarpaulin --locked
      - name: Generate coverage
        run: cargo tarpaulin -p mp-core --out Xml --timeout 120
      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: cobertura.xml
          fail_ci_if_error: false

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - run: cargo install cargo-audit --locked
      # RUSTSEC-2026-0194/-0195: quick-xml 0.39 DoS, transitive via plist->tauri;
      # patched only in quick-xml >=0.41, no compatible plist release yet (checked 2026-07-03).
      # Remove both ignores once plist ships a quick-xml >=0.41 dependency.
      # RUSTSEC-2024-0429: unsound glib::VariantStrIter, transitive via gtk->muda->tauri's
      # Linux backend only (this app targets macOS; audit runs on ubuntu-latest so it still
      # pulls the Linux dependency tree). Remove once tauri/muda bump their glib dependency.
      - run: cargo audit --ignore RUSTSEC-2024-0370 --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195 --ignore RUSTSEC-2024-0429
