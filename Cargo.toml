[workspace]
resolver = "2"
members  = ["crates/mp-core", "crates/mp-cli", "src-tauri"]

[workspace.package]
version = "1.8.1"
edition = "2021"

[workspace.dependencies]
serde        = { version = "1",    features = ["derive"] }
serde_json   = "1"
tokio        = { version = "1",    features = ["full"] }
reqwest      = { version = "0.13", features = ["json", "rustls"], default-features = false }
# Die Default-Features von keyring 4 enthalten den Apple-Keychain-Store bereits
# (default -> v1 -> apple-native-keyring-store/keychain). In Version 3 war das
# noch anders: dort gab es keine Default-Features, und eine Deklaration ohne
# Plattform-Feature kompilierte zwar, speicherte aber nichts.
keyring      = "4"
chrono       = { version = "0.4",  features = ["serde"] }
uuid         = { version = "1",    features = ["v4", "serde"] }
thiserror    = "2"
anyhow       = "1"
tracing      = "0.1"
async-trait  = "0.1"
